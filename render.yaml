services:
  # ==========================================================
  # BACKEND WEB SERVICE (Express + MongoDB REST API)
  # ==========================================================
  - type: web
    name: wildtour-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Provide your MongoDB Atlas connection string in Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render will generate a cryptographically secure 256-bit key
      - key: FRONTEND_URL
        fromService:
          type: web
          name: wildtour-frontend
          property: host

  # ==========================================================
  # FRONTEND STATIC SITE (Vite + React 19 SPA)
  # ==========================================================
  - type: web
    name: wildtour-frontend
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA fallback routing rule (prevents 404 on page refresh)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to https://wildtour-api.onrender.com/api (replace with your actual backend URL)
